spring:
  application:
    name: sssp
  datasource:
    url: jdbc:postgresql://localhost:5432/sssp
    username: sssp
    password: sssp
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-chars}
    expiration-ms: 86400000
